name: ML CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-and-push:
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Download your code onto the runner ──────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Install Python ───────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Step 3: Install your dependencies ───────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 4: Pull data from S3 via DVC ───────────────
      - name: Pull data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc pull

      # ── Step 5: Train the model ──────────────────────────
      - name: Train model
        run: python train.py

      # ── Step 6: Push updated model back to S3 ───────────
      - name: Push model to S3 (DVC)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc push

      # ── Step 7: Copy model to S3 root for the app ───────
      - name: Copy model to S3 root
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp models/model.joblib s3://mlops-titanic-dushyant/model.joblib